# Dynatrace API token declaration for enablement-kubernetes-101.
#
# This file carries only the repo-specific override: the migration status. The
# token list (operator + ingest) is absent deliberately — Orbital uses
# DEFAULT_SPECS (which mirrors codespaces-framework/dt-tokens.yaml exactly) when
# the `tokens:` block is not present, so there is nothing to duplicate here.
#
# PROVEN to run where classic API-token creation is retired: on such a tenant the
# app falls back to platform minting and translates the classic scopes through
# CLASSIC_TO_PLATFORM (api/_platform-mint.ts, mirrored in
# provisioning/token_specs.py). Two scopes do not survive that translation and are
# dropped by design — `DataExport` and `openTelemetryTrace.ingest`, both mapped to
# None as "covered elsewhere / not needed for applicationMonitoring".
# `migration_gaps()` reports them rather than leaving the claim and the drop
# invisible to each other.
migrationStatus: migrated

# ⚠️ `kind:` is deliberately NOT pinned to `platform`.
#
# `migrationStatus` and `kind` answer different questions. `migrationStatus` says
# this training works on a classic-retired tenant. `kind` says which API mints it.
# Pinning `platform` would take the classic path away on tenants where classic STILL
# WORKS, and classic tokens are self-contained: no `scopes ∩ owner IAM policy`
# intersection, no per-owner cap. That intersection is finding #2 — a 201 from the
# mint API, a token that cannot do the job, and no error anywhere. Pinning would
# trade finding #1's loud 412 for finding #2's silent stall on every tenant that had
# neither problem.
#
# So: classic first where classic exists, platform fallback where it does not, and a
# status that says the fallback has been exercised. `mintTrainingTokens.function.ts`
# already routes exactly this way, per environment, cached by HTTP status.
